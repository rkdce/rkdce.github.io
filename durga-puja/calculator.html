
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 8px;
}

.calculator {
    width: 100%;
    max-width: 430px;
    margin: auto;
    background: white;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #00000010;
}

h1 {
    text-align: center;
    font-size: 21px;
    color: #1e293b;
    margin: 4px 0 15px;
}

.row {
    display: grid;
    grid-template-columns: 1fr 0.8fr 0.85fr;
    gap: 6px;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid #e5e7eb;
}

.header {
    color: #64748b;
    font-size: 11px;
    font-weight: bold;
    padding: 5px 0;
}

.row label {
    font-size: 13px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

input {
    width: 100%;
    min-width: 0;
    height: 34px;
    padding: 4px;
    font-size: 15px;
    text-align: center;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    outline: none;
    background: #fff;
}

input:focus {
    border-color: #2563eb;
}

.amount {
    text-align: right;
    font-size: 13px;
    font-weight: bold;
    color: #334155;
    overflow-wrap: anywhere;
}

.total-box {
    background: #e7fbf4;
    padding: 12px 6px;
    border-radius: 10px;
    margin-top: 12px;
    text-align: center;
}

.total-box p {
    margin: 0 0 5px;
    color: #047857;
    font-size: 13px;
    font-weight: bold;
}

#total {
    font-size: 25px;
    font-weight: bold;
    color: #065f46;
    overflow-wrap: anywhere;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 9px;
    border: none;
    border-radius: 7px;
    background: #60758e;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

@media (max-height: 750px) {
    .calculator {
        padding: 8px;
    }

    h1 {
        font-size: 19px;
        margin: 2px 0 8px;
    }

    .row {
        padding: 4px 0;
    }

    input {
        height: 29px;
        font-size: 14px;
    }

    .total-box {
        margin-top: 8px;
        padding: 8px;
    }

    #total {
        font-size: 22px;
    }

    button {
        margin-top: 7px;
        padding: 7px;
    }
}
</style>
</head>

<body>
<div class="calculator">

    <h1>💵 Cash Calculator</h1>

    <div class="row header">
        <div>Denomination</div>
        <div>Number</div>
        <div style="text-align:right">Amount (₹)</div>
    </div>

    <div id="rows"></div>

    <div class="row">
        <label for="coins">Remaining Coins (₹)</label>
        <input type="number" id="coins" min="0"
               step="0.01" value="0" inputmode="decimal">
        <div class="amount" id="coinAmount">₹0.00</div>
    </div>

    <div class="total-box">
        <p>GRAND TOTAL</p>
        <div id="total">₹0.00</div>
    </div>

    <button type="button" onclick="resetCalculator()">
        Reset All
    </button>

</div>

<script>
const denominations = [500, 200, 100, 50, 20, 10, 5];

const rows = document.getElementById("rows");

denominations.forEach(value => {
    rows.innerHTML += `
        <div class="row">
            <label for="count${value}">₹${value} Notes</label>
            <input type="number" id="count${value}"
                   min="0" step="1" value="0"
                   inputmode="numeric">
            <div class="amount" id="amount${value}">₹0</div>
        </div>
    `;
});

function formatRupees(amount, decimals = 0) {
    return "₹" + amount.toLocaleString("en-IN", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
    });
}

function calculate() {
    let total = 0;

    denominations.forEach(value => {
        const input = document.getElementById("count" + value);
        const count = Math.max(0, Math.floor(Number(input.value) || 0));
        const amount = count * value;

        document.getElementById("amount" + value).textContent =
            formatRupees(amount);

        total += amount;
    });

    const coins = Math.max(
        0,
        Number(document.getElementById("coins").value) || 0
    );

    document.getElementById("coinAmount").textContent =
        formatRupees(coins, 2);

    total += coins;

    document.getElementById("total").textContent =
        formatRupees(total, 2);
}

function setupInput(input) {
    input.addEventListener("focus", function() {
        if (this.value === "0") {
            this.value = "";
        }
    });

    input.addEventListener("input", calculate);

    input.addEventListener("blur", function() {
        if (this.value.trim() === "") {
            this.value = "0";
            calculate();
        }
    });
}

document.querySelectorAll('input[type="number"]')
    .forEach(setupInput);

function resetCalculator() {
    denominations.forEach(value => {
        document.getElementById("count" + value).value = "0";
    });

    document.getElementById("coins").value = "0";
    calculate();
}

calculate();
</script>
</body>
</html>
